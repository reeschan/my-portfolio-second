name: codeql

# GitHub の静的解析 (CodeQL) で、JavaScript / TypeScript と GitHub Actions のセキュリティ上の問題を探す (ADR 0014)
# 結果はリポジトリの Security タブに出る。ci-ok の必須チェックには含めない (誤検知でマージを止めないため)

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # 依存や解析ルールの更新で新しく見つかるものを拾う (月曜 9:00 JST)
    - cron: "0 0 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    # PR は作成者が持ち主・dependabot[bot]・github-actions[bot] (このリポジトリの release-pr が作るリリース PR) のときだけ解析する (public リポジトリで他人の PR に費用をかけない)。
    # push と schedule は常に動かす
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login == github.repository_owner || github.event.pull_request.user.login == 'dependabot[bot]' || github.event.pull_request.user.login == 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-and-quality
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
